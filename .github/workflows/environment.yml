name: Atualizar Meio Ambiente
on:
  schedule:
    - cron: '23 9 * * 4'
    - cron: '23 12 14 * *'
  workflow_dispatch:
    inputs:
      source:
        description: Fonte a reconsultar (all = todas)
        type: choice
        default: all
        options: [all, land, fire, water, protection]
permissions:
  contents: write
concurrency:
  group: data-update
  cancel-in-progress: false
jobs:
  environment:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements-environment.txt
      # Quinta-feira: INPE; dia 14: todas as fontes (inclui revisões de cobertura).
      # Arquivos nacionais temporários, nunca artefatos ou arquivos públicos.
      - name: Escolher escopo da coleta
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          SOURCE: ${{ inputs.source || 'all' }}
        run: |
          if [ "$EVENT" = 'schedule' ] && [ "$SCHEDULE" = '23 9 * * 4' ]; then
            echo 'ENVIRONMENT_SOURCE=fire' >> "$GITHUB_ENV"
          else
            echo "ENVIRONMENT_SOURCE=$SOURCE" >> "$GITHUB_ENV"
          fi
      - name: Coletar fontes ambientais e preservar última entrega válida
        id: collect
        continue-on-error: true
        run: python scripts/etl.py --module environment --environment-source "$ENVIRONMENT_SOURCE"
      - run: python scripts/etl.py --module environment --offline
      - name: Detectar mudanças nos arquivos do módulo
        id: changes
        run: |
          git add -- 'public/data/environment.json' 'public/data/environment' 'public/data/exports/environment-*.csv' 'public/data/indicators.json'
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v7.0.0
        if: steps.changes.outputs.changed == 'true'
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
        if: steps.changes.outputs.changed == 'true'
      - run: npm test
        if: steps.changes.outputs.changed == 'true'
      - run: npm run build
        if: steps.changes.outputs.changed == 'true'
      - name: Versionar dados somente após validação
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data: atualizar fontes ambientais municipais'
          # Push normal: se main avançar durante a coleta, falhar sem sobrescrever.
          git push origin HEAD:main
      - name: Sinalizar coleta com falha após preservar snapshot
        if: always() && steps.collect.outcome == 'failure'
        run: exit 1
