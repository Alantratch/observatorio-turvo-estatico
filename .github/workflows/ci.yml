name: Validar e compilar
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements-education.txt
      - run: npm ci
      - run: npm test
      - name: Validar todos os snapshots sem consultas externas
        run: |
          for module in all employment education health agriculture social; do
            python scripts/etl.py --module "$module" --offline
          done
      - run: npm run build
