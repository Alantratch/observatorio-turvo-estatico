name: Atualizar dados públicos
on:
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data-update
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements-education.txt
      - name: Coletar e preservar snapshots
        id: collect
        continue-on-error: true
        run: python scripts/etl.py
      - run: python -m unittest discover -s tests
      - name: Versionar snapshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data
          if ! git diff --cached --quiet; then
            git commit -m 'data: atualizar snapshots públicos'
            git push
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dados-e-site
          path: dist
      - name: Publicar snapshots no Cloudflare Pages (se configurado)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            npx wrangler@4 pages deploy dist --project-name observatorio-turvo-estatico --branch main
          fi
      - name: Sinalizar falha após preservar e publicar o relatório
        if: steps.collect.outcome == 'failure'
        run: |
          echo '::error::Coleta incompleta; último snapshot preservado. Consulte collection.failures em population.json e economy.json.'
          exit 1
