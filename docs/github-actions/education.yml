# Copy to .github/workflows/education.yml with workflow write permission.
name: Atualizar Educação INEP
on:
  schedule:
    - cron: '19 11 5 * *'
  workflow_dispatch:
    inputs:
      force:
        description: Verificar revisões e reprocessar a mesma publicação
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: data-update
  cancel-in-progress: false
jobs:
  education:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements-education.txt
      # Monthly run discovers HTML catalogs first. Already processed source+URL
      # is skipped: no national download and no timestamp-only snapshot commit.
      # Annual/assessment archives are temporary and never cached as public artifacts.
      - name: Coletar novas publicações e preservar dados válidos
        id: collect
        continue-on-error: true
        env:
          FORCE: ${{ inputs.force }}
        run: |
          args=(--module education)
          if [ "$FORCE" = 'true' ]; then args+=(--force); fi
          python scripts/etl.py "${args[@]}"
      - run: python scripts/etl.py --module education --offline
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Versionar apenas mudanças efetivas de Educação
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/education.json public/data/exports/education-*.csv public/data/indicators.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: atualizar publicações Educação INEP'
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: observatorio-educacao
          path: dist
      - name: Sinalizar falha depois de preservar snapshot e relatório
        if: steps.collect.outcome == 'failure'
        run: exit 1
