name: Atualizar Trabalho e Emprego
on:
  schedule:
    - cron: '31 10 3 * *'
  workflow_dispatch:
    inputs:
      source:
        description: Base para atualizar
        type: choice
        options: [caged, rais, all]
        default: all
      force:
        description: Reprocessar mesma divulgação (revisões)
        type: boolean
        default: false
      remuneration:
        description: Processar remuneração RAIS (arquivo regional grande; layout validado)
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  # Same group as the weekly ETL: snapshots cannot be pushed concurrently.
  group: data-update
  cancel-in-progress: false
jobs:
  employment:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements-education.txt
      - name: Leitor dos arquivos oficiais 7z
        run: sudo apt-get update && sudo apt-get install -y 7zip
      # Temporary compressed data is not cached publicly or versioned.
      # Monthly schedule checks for a new CAGED/RAIS publication before downloading.
      # RAIS table is a small HTTPS workbook; optional remuneration is a large regional archive.
      - name: Coletar e preservar dados anteriores em caso de falha
        id: collect
        continue-on-error: true
        env:
          SOURCE: ${{ inputs.source || 'all' }}
          FORCE: ${{ inputs.force }}
          REMUNERATION: ${{ inputs.remuneration }}
        run: |
          args=(--module employment --source "$SOURCE")
          if [ "$FORCE" = 'true' ]; then args+=(--force); fi
          if [ "$REMUNERATION" = 'true' ]; then args+=(--rais-remuneration); fi
          python scripts/etl.py "${args[@]}"
      - name: Validar snapshots e aplicação
        run: |
          python scripts/etl.py --module employment --offline
      - name: Detectar mudanças nos arquivos do módulo
        id: changes
        run: |
          git add -- 'public/data/employment.json' 'public/data/metadata/employment' 'public/data/exports/caged-*.csv' 'public/data/exports/rais-*.csv' 'public/data/indicators.json'
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v7.0.0
        if: steps.changes.outputs.changed == 'true'
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
        if: steps.changes.outputs.changed == 'true'
      - run: npm test
        if: steps.changes.outputs.changed == 'true'
      - run: npm run build
        if: steps.changes.outputs.changed == 'true'
      - name: Versionar dados somente após validação
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data: atualizar Trabalho e Emprego MTE'
          # Push normal: se main avançar durante a coleta, falhar sem sobrescrever.
          git push origin HEAD:main
      - name: Sinalizar falha após preservar snapshot e relatório
        if: always() && steps.collect.outcome == 'failure'
        run: exit 1
