name: Atualizar Agropecuária IBGE
on:
  schedule:
    - cron: '43 11 9 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data-update
  cancel-in-progress: false
jobs:
  agriculture:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements-education.txt
      # Reconsultar a janela inteira, incorporando revisões retroativas.
      # Só cinco territórios; nenhuma base nacional ou microdado no repositório.
      - name: Coletar bases IBGE e preservar última entrega válida
        id: collect
        continue-on-error: true
        run: python scripts/etl.py --module agriculture
      - run: python scripts/etl.py --module agriculture --offline
      - name: Detectar mudanças nos arquivos do módulo
        id: changes
        run: |
          git add -- 'public/data/agriculture.json' 'public/data/agriculture' 'public/data/exports/agriculture-*.csv' 'public/data/indicators.json'
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.changed == 'true'
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
        if: steps.changes.outputs.changed == 'true'
      - run: npm test
        if: steps.changes.outputs.changed == 'true'
      - run: npm run build
        if: steps.changes.outputs.changed == 'true'
      - name: Versionar dados somente após validação
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data: atualizar PAM PPM PEVS e Censo Agropecuário'
          # Push normal: se main avançar durante a coleta, falhar sem sobrescrever.
          git push origin HEAD:main
      - name: Sinalizar coleta com falha após preservar snapshot
        if: always() && steps.collect.outcome == 'failure'
        run: exit 1
