name: Validar e compilar
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements-education.txt
      - run: npm ci
      - run: npm test
      - run: python scripts/etl.py --offline
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: site-estatico
          path: dist
