# Copiar para .github/workflows/social.yml com permissão de escrita de workflows.
name: Atualizar Assistência Social MDS
on:
  schedule:
    - cron: '17 12 12 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data-update
  cancel-in-progress: false
jobs:
  social:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements-education.txt
      # Verificar publicações mensais e anuais, preservando referências próprias.
      # Quatro municípios; somente agregados/equipamentos. RH nunca é lido.
      - name: Coletar agregados MDS e preservar última entrega válida
        id: collect
        continue-on-error: true
        run: python scripts/etl.py --module social
      - run: python scripts/etl.py --module social --offline
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Versionar mudanças de Assistência Social
        id: publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/social.json public/data/exports/social-*.csv public/data/indicators.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: atualizar agregados MDS e rede SUAS'
            git push
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: observatorio-assistencia-social
          path: dist
      - name: Deploy Cloudflare Pages quando configurado
        if: steps.publish.outputs.changed == 'true' && steps.collect.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            npx wrangler@4 pages deploy dist --project-name observatorio-turvo-estatico --branch "${{ github.ref_name }}"
          fi
      - name: Sinalizar coleta com falha após preservar snapshot
        if: steps.collect.outcome == 'failure'
        run: exit 1
