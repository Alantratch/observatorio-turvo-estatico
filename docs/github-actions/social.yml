name: Atualizar Assistência Social MDS
on:
  schedule:
    - cron: '17 12 12 * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data-update
  cancel-in-progress: false
jobs:
  social:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements-education.txt
      # Verificar publicações mensais e anuais, preservando referências próprias.
      # Quatro municípios; somente agregados/equipamentos. RH nunca é lido.
      - name: Coletar agregados MDS e preservar última entrega válida
        id: collect
        continue-on-error: true
        run: python scripts/etl.py --module social
      - run: python scripts/etl.py --module social --offline
      - name: Detectar mudanças nos arquivos do módulo
        id: changes
        run: |
          git add -- 'public/data/social.json' 'public/data/exports/social-*.csv' 'public/data/indicators.json'
          if git diff --cached --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v7.0.0
        if: steps.changes.outputs.changed == 'true'
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
        if: steps.changes.outputs.changed == 'true'
      - run: npm test
        if: steps.changes.outputs.changed == 'true'
      - run: npm run build
        if: steps.changes.outputs.changed == 'true'
      - name: Versionar dados somente após validação
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data: atualizar agregados MDS e rede SUAS'
          # Push normal: se main avançar durante a coleta, falhar sem sobrescrever.
          git push origin HEAD:main
      - name: Sinalizar coleta com falha após preservar snapshot
        if: always() && steps.collect.outcome == 'failure'
        run: exit 1
